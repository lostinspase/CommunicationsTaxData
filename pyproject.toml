[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "communications-tax-data"
version = "0.1.0"
description = "Auditable public-source communications and sales tax data collection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13.4",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "pypdf>=5.8.0",
  "pydantic-settings>=2.10.1",
  "pymysql>=1.1.1",
  "sqlalchemy>=2.0.41",
  "typer>=0.16.0",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "ruff>=0.12.4",
]

[project.scripts]
ctd = "communications_tax_data.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/communications_tax_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
